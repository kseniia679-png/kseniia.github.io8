<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            height: 100vh;
            width: 100vw;
            background:
                radial-gradient(circle at 50% 15%, rgba(120, 219, 255, 0.20), transparent 22%),
                radial-gradient(circle at 12% 20%, rgba(118, 74, 255, 0.22), transparent 25%),
                radial-gradient(circle at 80% 15%, rgba(255, 158, 206, 0.18), transparent 18%),
                linear-gradient(180deg, #071d2b 0%, #061a23 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            position: relative;
        }

        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 12;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: white;
            padding: 10px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 0.02em;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: rgba(0, 180, 216, 0.35);
            border-color: rgba(202, 240, 248, 0.7);
            transform: translateY(-1px) scale(1.03);
        }

        .container {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 20px;
        }

        .card {
            pointer-events: auto;
            background: rgba(7, 24, 34, 0.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 34px 28px 28px;
            text-align: center;
            box-shadow:
                0 18px 45px rgba(0, 180, 216, 0.18),
                inset 0 0 20px rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(129, 219, 255, 0.15);
            border: 1px solid rgba(144, 224, 239, 0.28);
            max-width: 520px;
            width: min(90vw, 500px);
            position: relative;
            overflow: hidden;
            animation: cardFloat 4s ease-in-out infinite alternate;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(144,224,239,0.08), rgba(255,255,255,0.02), rgba(0,180,216,0.06));
            pointer-events: none;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        h1 {
            position: relative;
            z-index: 1;
            font-size: clamp(28px, 4vw, 36px);
            margin-bottom: 12px;
            color: #caf0f8;
            text-shadow: 0 0 15px rgba(0, 180, 216, 0.65);
            letter-spacing: 0.02em;
        }

        .subtitle {
            position: relative;
            z-index: 1;
            font-size: 15px;
            color: #a5eaf7;
            margin-bottom: 24px;
        }

        .cake-container {
            position: relative;
            margin: 18px auto 26px;
            width: 200px;
            height: 125px;
            cursor: pointer;
            z-index: 1;
            filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.2));
            transition: transform 0.2s ease;
        }

        .cake-container:hover {
            transform: scale(1.02);
        }

        .cake-base {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 180px;
            height: 62px;
            background: linear-gradient(to right, #0077b6, #00b4d8, #0077b6);
            border-radius: 12px 12px 7px 7px;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.18), 0 4px 12px rgba(0,0,0,0.35);
        }

        .cake-top {
            position: absolute;
            bottom: 62px;
            left: 23px;
            width: 154px;
            height: 44px;
            background: linear-gradient(to right, #b3ecff, #dff9ff, #b3ecff);
            border-radius: 12px 12px 0 0;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.35);
        }

        .candles {
            position: absolute;
            bottom: 104px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 30px;
        }

        .candle {
            width: 12px;
            height: 32px;
            background: linear-gradient(to bottom, #ff6a88, #fff2f5);
            border-radius: 5px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(255, 105, 132, 0.35);
        }

        .flame {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 16px;
            background: linear-gradient(180deg, #ffd166, #ff9f1c 70%, #ff7b00);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 0 12px rgba(255, 190, 77, 0.7), 0 0 24px rgba(255, 140, 0, 0.8);
            animation: flicker 0.6s infinite alternate;
        }

        .flame.off {
            display: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.18) rotate(2deg); }
        }

        .instruction {
            position: relative;
            z-index: 1;
            font-size: 13px;
            color: #75d9f7;
            margin-top: -8px;
            margin-bottom: 10px;
            letter-spacing: 0.03em;
        }

        .floating-gift {
            position: absolute;
            z-index: 3;
            font-size: 38px;
            cursor: pointer;
            filter: drop-shadow(0 0 10px rgba(0, 180, 216, 0.75));
            transition: transform 0.2s ease;
            animation: floatAnim 6s infinite ease-in-out alternate;
            opacity: 0.96;
        }

        .floating-gift:hover {
            transform: scale(1.3) rotate(10deg);
        }

        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(15deg); }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 20;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 15, 26, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: linear-gradient(135deg, rgba(11, 37, 69, 0.98), rgba(19, 64, 116, 0.94));
            border: 2px solid rgba(72, 202, 228, 0.9);
            border-radius: 26px;
            padding: 32px 28px 28px;
            text-align: center;
            max-width: 420px;
            width: 85%;
            box-shadow: 0 14px 46px rgba(0, 180, 216, 0.38);
            animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .modal-box::before {
            content: "";
            position: absolute;
            inset: -20% auto auto -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 60%);
            pointer-events: none;
        }

        @keyframes popIn {
            from { transform: scale(0.62); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon { font-size: 55px; margin-bottom: 8px; position: relative; z-index: 1; }
        .modal-title { font-size: 24px; color: #caf0f8; margin-bottom: 12px; position: relative; z-index: 1; }
        .modal-text { font-size: 16px; color: #a8eaf7; line-height: 1.6; margin-bottom: 24px; position: relative; z-index: 1; }

        .modal-btn {
            background: linear-gradient(135deg, #00b4d8, #90e0ef);
            color: #03162e;
            font-weight: 700;
            border: none;
            padding: 12px 30px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 18px rgba(0, 180, 216, 0.35);
            position: relative;
            z-index: 1;
        }

        .modal-btn:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 12px 20px rgba(0, 180, 216, 0.42);
        }

        @media (max-width: 560px) {
            .card {
                padding: 26px 18px 22px;
            }

            .floating-gift {
                font-size: 30px;
            }

            .music-btn {
                top: 14px;
                right: 14px;
                padding: 9px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <button class="music-btn" id="musicToggle">🎵 Включить музыку</button>
    <canvas id="canvas"></canvas>

    <div class="floating-gift" style="top: 15%; left: 10%; animation-delay: 0s;" onclick="openWish(0, event)">🎁</div>
    <div class="floating-gift" style="top: 25%; right: 12%; animation-delay: 1.5s;" onclick="openWish(1, event)">🎁</div>
    <div class="floating-gift" style="bottom: 18%; left: 15%; animation-delay: 3s;" onclick="openWish(2, event)">🎁</div>
    <div class="floating-gift" style="bottom: 22%; right: 15%; animation-delay: 4.5s;" onclick="openWish(3, event)">🎁</div>

    <div class="container">
        <div class="card">
            <h1>С Днём Рождения, Подруга! 💙</h1>
            <p class="subtitle">Кликай по экрану для салюта и открывай подарки вокруг!</p>

            <div class="cake-container">
                <div class="candles">
                    <div class="candle" onclick="extinguishCandle(this, event)"><div class="flame"></div></div>
                    <div class="candle" onclick="extinguishCandle(this, event)"><div class="flame"></div></div>
                    <div class="candle" onclick="extinguishCandle(this, event)"><div class="flame"></div></div>
                </div>
                <div class="cake-top"></div>
                <div class="cake-base"></div>
            </div>
            <p class="instruction">🕯️ Нажми на свечи, чтобы зажечь желание!</p>
        </div>
    </div>

    <div class="modal" id="wishModal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">✨</div>
            <div class="modal-title" id="modalTitle">Пожелание</div>
            <div class="modal-text" id="modalText">Текст</div>
            <button class="modal-btn" onclick="closeWish()">Спасибо! ✨</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const stars = [];

        for(let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2.2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.006
            });
        }

        function createFirework(x, y) {
            const colors = ['#00b4d8', '#90e0ef', '#caf0f8', '#ffb703', '#ffffff', '#7209b7', '#48cae4', '#ff6ec7'];
            const particleCount = 80;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i + (Math.random() - 0.5);
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    gravity: 0.1
                });
            }
        }

        canvas.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
            playBeep(400 + Math.random() * 400, 0.05);
        });

        function animate() {
            ctx.fillStyle = 'rgba(6, 26, 35, 0.25)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.alpha -= p.decay;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();

        setInterval(() => {
            createFirework(Math.random() * width, Math.random() * height * 0.6);
        }, 2500);

        const wishes = [
            { icon: "🌟", title: "Ярких Моментов!", text: "Пусть каждый день приносит столько же радости, сколько звёзд на небе, а твоя улыбка освещает даже самые серые будни." },
            { icon: "💖", title: "Настоящего Счастья!", text: "Желаю тебе окружения из самых искренних людей, исполнения всех мечтаний и любви, которая согревает душу каждый день." },
            { icon: "🚀", title: "Головокружительных Успехов!", text: "Пусть любые твои задумки сбываются легко и вдохновляюще, а уверенность в себе будет расти вместе с тобой." },
            { icon: "🌊", title: "Океан Гармонии!", text: "Пусть в душе всегда будет уют, тепло и спокойствие, а на лице — счастье, которое невозможно скрыть." }
        ];

        function openWish(index, event) {
            event.stopPropagation();
            const w = wishes[index];
            document.getElementById('modalIcon').innerText = w.icon;
            document.getElementById('modalTitle').innerText = w.title;
            document.getElementById('modalText').innerText = w.text;
            document.getElementById('wishModal').style.display = 'flex';

            const rect = event.target.getBoundingClientRect();
            createFirework(rect.left + 20, rect.top + 20);
        }

        function closeWish() {
            document.getElementById('wishModal').style.display = 'none';
        }

        let extinguishedCount = 0;

        function extinguishCandle(candle, event) {
            event.stopPropagation();
            const flame = candle.querySelector('.flame');
            if (!flame.classList.contains('off')) {
                flame.classList.add('off');
                extinguishedCount++;
                const rect = candle.getBoundingClientRect();
                createFirework(rect.left, rect.top);

                if (extinguishedCount === 3) {
                    setTimeout(() => {
                        openWish(0, event);
                        document.getElementById('modalTitle').innerText = '🎂 Загаданное желание сбудется!';
                        document.getElementById('modalText').innerText = 'Все свечи задуты! Пусть твоё самое сокровенное желание обязательно исполнится, а рядом всегда будут любовь, тепло и счастье.';
                    }, 500);
                }
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(freq, duration) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        let isPlaying = false;
        let musicInterval;
        const notes = [
            264, 264, 297, 264, 352, 330,
            264, 264, 297, 264, 396, 352,
            264, 264, 528, 440, 352, 330, 297
        ];

        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isPlaying) {
                isPlaying = true;
                document.getElementById('musicToggle').innerText = '🔇 Выключить музыку';
                let noteIdx = 0;
                musicInterval = setInterval(() => {
                    playBeep(notes[noteIdx % notes.length], 0.3);
                    noteIdx++;
                }, 400);
            } else {
                isPlaying = false;
                document.getElementById('musicToggle').innerText = '🎵 Включить музыку';
                clearInterval(musicInterval);
            }
        });
    </script>
</body>
</html>
