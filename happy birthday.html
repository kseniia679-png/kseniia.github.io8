<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Рождения!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at center, #1b3a4b 0%, #061a23 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        /* Кнопка музыки */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .music-btn:hover {
            background: rgba(0, 180, 216, 0.4);
            transform: scale(1.05);
        }

        /* Основной контейнер */
        .container {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            padding: 20px;
        }

        .card {
            pointer-events: auto;
            background: rgba(10, 25, 47, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 180, 216, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 180, 216, 0.4);
            max-width: 500px;
            width: 90%;
            animation: cardFloat 4s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
            color: #caf0f8;
            text-shadow: 0 0 12px rgba(0, 180, 216, 0.6);
        }

        .subtitle {
            font-size: 15px;
            color: #90e0ef;
            margin-bottom: 25px;
        }

        /* Торт */
        .cake-container {
            margin: 20px auto 30px;
            width: 180px;
            height: 120px;
            position: relative;
            cursor: pointer;
        }

        .cake-base {
            position: absolute;
            bottom: 0;
            width: 180px;
            height: 60px;
            background: linear-gradient(to right, #0077b6, #00b4d8, #0077b6);
            border-radius: 12px 12px 4px 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .cake-top {
            position: absolute;
            bottom: 60px;
            left: 15px;
            width: 150px;
            height: 45px;
            background: linear-gradient(to right, #90e0ef, #caf0f8, #90e0ef);
            border-radius: 10px 10px 0 0;
        }

        .candles {
            position: absolute;
            bottom: 105px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 35px;
        }

        .candle {
            width: 10px;
            height: 28px;
            background: linear-gradient(to bottom, #ff4d6d, #fff);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .flame {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 14px;
            background: #ffb703;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 10px #ffb703, 0 0 20px #fb8500;
            animation: flicker 0.6s infinite alternate;
        }

        .flame.off {
            display: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.15) rotate(2deg); }
        }

        .instruction {
            font-size: 13px;
            color: #48cae4;
            margin-top: -15px;
            margin-bottom: 20px;
        }

        /* Интерактивные плавающие подарки */
        .floating-gift {
            position: absolute;
            z-index: 3;
            font-size: 38px;
            cursor: pointer;
            filter: drop-shadow(0 0 8px rgba(0, 180, 216, 0.8));
            transition: transform 0.2s ease;
            animation: floatAnim 6s infinite ease-in-out alternate;
        }
        .floating-gift:hover {
            transform: scale(1.3) rotate(10deg);
        }

        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(15deg); }
        }

        /* Модальное окно пожелания */
        .modal {
            display: none;
            position: fixed;
            z-index: 20;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 15, 26, 0.8);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: linear-gradient(135deg, #0b2545, #134074);
            border: 2px solid #48cae4;
            border-radius: 24px;
            padding: 35px;
            text-align: center;
            max-width: 420px;
            width: 85%;
            box-shadow: 0 10px 40px rgba(0, 180, 216, 0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-icon { font-size: 55px; margin-bottom: 10px; }
        .modal-title { font-size: 24px; color: #caf0f8; margin-bottom: 12px; }
        .modal-text { font-size: 16px; color: #90e0ef; line-height: 1.6; margin-bottom: 25px; }

        .modal-btn {
            background: #00b4d8;
            color: #03045e;
            font-weight: bold;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s;
        }
        .modal-btn:hover { background: #caf0f8; }
    </style>
</head>
<body>

    <button class="music-btn" id="musicToggle">🎵 Включить музыку</button>
    <canvas id="canvas"></canvas>

    <!-- Подарки, плавающие по экрану -->
    <div class="floating-gift" style="top: 15%; left: 10%; animation-delay: 0s;" onclick="openWish(0, event)">🎁</div>
    <div class="floating-gift" style="top: 25%; right: 12%; animation-delay: 1.5s;" onclick="openWish(1, event)">🎁</div>
    <div class="floating-gift" style="bottom: 18%; left: 15%; animation-delay: 3s;" onclick="openWish(2, event)">🎁</div>
    <div class="floating-gift" style="bottom: 22%; right: 15%; animation-delay: 4.5s;" onclick="openWish(3, event)">🎁</div>

    <div class="container">
        <div class="card">
            <h1>С Днём Рождения, Подруга! 💙</h1>
            <p class="subtitle">Кликай по экрану для салюта и открывай подарки вокруг!</p>

            <div class="cake-container">
                <div class="candles">
                    <div class="candle" onclick="extinguishCandle(this, event)"><div class="flame"></div></div>
                    <div class="candle" onclick="extinguishCandle(this, event)"><div class="flame"></div></div>
                    <div class="candle" onclick="extinguishCandle(this, event)"><div class="flame"></div></div>
                </div>
                <div class="cake-top"></div>
                <div class="cake-base"></div>
            </div>
            <p class="instruction">🕯️ Нажми на свечи, чтобы зажечь желание!</p>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="wishModal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">✨</div>
            <div class="modal-title" id="modalTitle">Пожелание</div>
            <div class="modal-text" id="modalText">Текст</div>
            <button class="modal-btn" onclick="closeWish()">Спасибо! ✨</button>
        </div>
    </div>

    <script>
        // === CANVAS & FIREWORKS SYSTEM ===
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const stars = [];

        // Создание звёздного фона
        for(let i = 0; i < 80; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function createFirework(x, y) {
            const colors = ['#00b4d8', '#90e0ef', '#caf0f8', '#ffb703', '#ffffff', '#7209b7', '#48cae4'];
            const particleCount = 70;
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i + (Math.random() - 0.5);
                const speed = Math.random() * 8 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    gravity: 0.1
                });
            }
        }

        // Клик по экрану создаёт салют
        canvas.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
            playBeep(400 + Math.random() * 400, 0.05);
        });

        function animate() {
            ctx.fillStyle = 'rgba(6, 26, 35, 0.25)';
            ctx.fillRect(0, 0, width, height);

            // Отрисовка фона
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Отрисовка частичек салюта
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.alpha -= p.decay;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Авто-салюты каждые 2.5 сек
        setInterval(() => {
            createFirework(Math.random() * width, Math.random() * height * 0.6);
        }, 2500);

        // === ПОЖЕЛАНИЯ И ПОДАРКИ ===
        const wishes = [
            { icon: "🌟", title: "Ярких Моментов!", text: "Пусть каждый день приносит столько же радости, сколько звёзд на этом ночном небе!" },
            { icon: "💖", title: "Настоящего Счастья!", text: "Желаю тебе окружения из самых искренних людей, исполнения всех целей и легких дорог!" },
            { icon: "🚀", title: "Головокружительных Успехов!", text: "Пусть любые твои задумки сбываются легко и вдохновляюще. Ты способна на всё!" },
            { icon: "🌊", title: "Океан Гармонии!", text: "Пусть в душе всегда будет уют, тепло, а на лице — твоя самая прекрасная улыбка!" }
        ];

        function openWish(index, event) {
            event.stopPropagation();
            const w = wishes[index];
            document.getElementById('modalIcon').innerText = w.icon;
            document.getElementById('modalTitle').innerText = w.title;
            document.getElementById('modalText').innerText = w.text;
            document.getElementById('wishModal').style.display = 'flex';
            
            const rect = event.target.getBoundingClientRect();
            createFirework(rect.left + 20, rect.top + 20);
        }

        function closeWish() {
            document.getElementById('wishModal').style.display = 'none';
        }

        // === СВЕЧИ И ТОРТ ===
        let extinguishedCount = 0;

        function extinguishCandle(candle, event) {
            event.stopPropagation();
            const flame = candle.querySelector('.flame');
            if (!flame.classList.contains('off')) {
                flame.classList.add('off');
                extinguishedCount++;
                const rect = candle.getBoundingClientRect();
                createFirework(rect.left, rect.top);

                if (extinguishedCount === 3) {
                    setTimeout(() => {
                        openWish(0, event);
                        document.getElementById('modalTitle').innerText = "🎂 Загаданное желание сбудется!";
                        document.getElementById('modalText').innerText = "Все свечи задуты! Пусть твое самое сокровенное желание обязательно исполнится!";
                    }, 500);
                }
            }
        }

        // === ЗВУКОВОЙ СИНТЕЗАТОР (Web Audio API) ===
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq, duration) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Простая мелодия Happy Birthday
        let isPlaying = false;
        let musicInterval;
        const notes = [
            264, 264, 297, 264, 352, 330,
            264, 264, 297, 264, 396, 352,
            264, 264, 528, 440, 352, 330, 297
        ];

        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isPlaying) {
                isPlaying = true;
                document.getElementById('musicToggle').innerText = "🔇 Выключить музыку";
                let noteIdx = 0;
                musicInterval = setInterval(() => {
                    playBeep(notes[noteIdx % notes.length], 0.3);
                    noteIdx++;
                }, 400);
            } else {
                isPlaying = false;
                document.getElementById('musicToggle').innerText = "🎵 Включить музыку";
                clearInterval(musicInterval);
            }
        });
    </script>
</body>
</html>
