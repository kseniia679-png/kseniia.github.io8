<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <title>Kseniian portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.6;
      background: #0f172a;
      color: #e5e7eb;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.3rem;
    }
    h2 {
      margin-top: 2rem;
      font-size: 1.4rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.3rem;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .tag {
      display: inline-block;
      background: #1e293b;
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      margin: 0.15rem;
      font-size: 0.85rem;
    }
    .card {
      background: #020617;
      border-radius: 0.75rem;
      padding: 1rem 1.2rem;
      margin-top: 1rem;
      border: 1px solid #1f2937;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.85rem;
      text-align: center;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kseniia – IT-tuki & oppiva kehittäjä</h1>
    <p>Kiinnostunut IT-tuesta, käytännön ongelmanratkaisusta ja rauhallisesta, selkeästä työskentelystä.</p>
  </header>

  <section>
    <h2>Minusta</h2>
    <p>
      Olen Kseniia, ohjelmointikehittäjä opiskelija. Pidän selkeästä
      dokumentoinnista, askel askeleelta etenemisestä ja siitä, että
      käyttäjä jää tilanteesta vähän varmemmaksi kuin ennen.
    </p>
    <p>
      Tavoitteeni on kehittyä luotettavaksi ohjelmointikehittäjäksi, joka osaa
      sekä Ohjelmointi perusasiat että rauhallisen, ystävällisen kommunikoinnin.
    </p>
  </section>

  <section>
    <h2>Osaaminen</h2>

    <div class="card">
      <h3>koodaus</h3>
      <p>
        Seuraavat taidot ovat jatkuvasti kehittymässä – pidän oppimisesta
        käytännön kautta ja dokumentoin mielelläni, mitä olen tehnyt.
      </p>
      <p>
        <span class="tag">Windows-peruskäyttö</span>
        <span class="tag">Kyberturvallisuus</span>
        <span class="tag">Ohjelmointi</span>
        <span class="tag">koodaus</span>
        <span class="tag">Tietoturvan perusperiaatteet</span>
      </p>
    </div>

    <div class="card">
      <h3>Ohjelmointi ja web-perusteet</h3>
      <p>
        Olen tutustunut web-kehityksen perusteisiin ja käytän niitä
        yksinkertaisten sivujen ja dokumenttien tekemiseen.
      </p>
      <p>
        <span class="tag">HTML – rakenteen luominen</span>
        <span class="tag">CSS – perusulkoasu ja typografia</span>
        <span class="tag">Git & GitHub – versionhallinnan perusteet</span>
        <span class="tag">Markdown – dokumentointi</span>
      </p>
      <p>
        Tavoitteena on rakentaa pieniä, selkeitä projekteja, joista näkee
        oppimisen etenemisen.
      </p>
    </div>

    <div class="card">
      <h3>Työtapa ja pehmeät taidot</h3>
      <p>
        <span class="tag">Rauhallinen ongelmanratkaisu</span>
        <span class="tag">Selkeä viestintä</span>
        <span class="tag">Kärsivällisyys käyttäjien kanssa</span>
        <span class="tag">Halukkuus oppia uutta</span>
      </p>
    </div>
  </section>

  <section>
    <h2>Projektit</h2>

    <div class="card">
      <h3>GitHub-portfoliosivu</h3>
      <p>
        Tämä sivu toimii yksinkertaisena portfoliosivuna GitHubissa.
        Tavoitteena on pitää rakenne selkeänä ja helposti luettavana.
      </p>
      <p>
        <strong>Tekniikat:</strong> HTML, CSS, Git, GitHub Pages
      </p>
    </div>

    <div class="card">
      <h3>Pienet harjoitusprojektit</h3>
      <p>
        Rakennan pieniä harjoituksia, kuten:
      </p>
      <ul>
        <li>Yksinkertaisia staattisia sivuja (esittelyt, muistiinpanot)</li>
        <li>Ohjeita ja dokumentteja Markdown-muodossa</li>
        <li>Testiprojekteja GitHubiin versionhallinnan harjoitteluun</li>
      </ul>
    </div>
  </section>

  <section>
    <h2>Yhteystiedot</h2>
    <p>
      GitHub: <a href="https://github.com/USERNAME" target="_blank">github.com/USERNAME</a><br />
      Sähköposti: <a href="mailto:esimerkki@posti.fi">esimerkki@posti.fi</a>
    </p>
  </section>

  <footer>
    <p>Rakennettu oppimista varten – päivittyy sitä mukaa kun taidot kasvavat.</p>
  </footer>
</body>
</html>
